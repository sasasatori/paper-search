[project]
name = "paper-search"
version = "0.2.0"
description = "Academic paper search tool (CLI + MCP server) aggregating OpenAlex, DBLP and more"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyalex>=0.14",
    "arxiv>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "mcp[cli]>=1.6.0",
]

[project.scripts]
paper-search = "paper_search.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_search"]
